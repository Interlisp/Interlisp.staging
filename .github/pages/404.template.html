<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <base href="{{BASE_PATH}}">
  <title>Page not found | Interlisp staging</title>
  <link rel="stylesheet" href="root.css">
  <script>
    (function () {
      'use strict';

      var basePath = '{{BASE_PATH}}';
      var path = window.location.pathname.replace(/\/+$/, '') + '/';
      var pattern = new RegExp(
        '^' + basePath.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + 'pr-(\\d+)(?:/|$)'
      );
      var match = path.match(pattern);
      if (!match) return;

      var prBase = basePath + 'pr-' + match[1] + '/';

      // Loop guard: if the base itself 404s (removed preview or failed
      // deploy), redirecting again would loop forever. Show the fallback.
      if (path !== prBase) {
        window.location.replace(
          prBase + window.location.search + window.location.hash
        );
      }
    })();
  </script>
</head>
<body>
  <h1>Page not found</h1>
  <p>The page you requested does not exist.</p>
  <p class="muted">
    If you were looking for a staging preview, it may have been removed when its
    pull request was closed or merged, or it may still be deploying.
  </p>
  <p class="muted">Requested path: <code id="requested-path"></code></p>

  <section aria-labelledby="previews-heading">
    <h2 id="previews-heading">Staging previews</h2>
    <ul id="previews">
<!-- PREVIEWS -->
    </ul>
  </section>

  <section class="production" aria-labelledby="production-heading">
    <h2 id="production-heading">Production site</h2>
    <ul>
      <li><a href="https://interlisp.org/">Interlisp.org</a></li>
    </ul>
  </section>

  <p class="muted">Updated <!-- UPDATED -->.</p>

  <noscript>
    <p class="muted">
      JavaScript is required to redirect a missing preview page to its home page.
      The preview list above still works.
    </p>
  </noscript>

  <script>
    document.getElementById('requested-path').textContent = window.location.pathname;
  </script>
</body>
</html>
